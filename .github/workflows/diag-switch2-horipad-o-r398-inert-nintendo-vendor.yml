name: R398 HORIPAD O FourSelect + inert Nintendo vendor shell

on:
  push:
    branches:
      - diag-switch2-horipad-o-r398-inert-nintendo-vendor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out r398 diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact r396 authority and narrow branch delta
        run: |
          set -eu
          R396=9256beb9c527104542f64e69a1af5647e47f773e
          R355=88b8e8cd1b9d028695b99cb294b6d8826699ea2b
          test "$(git merge-base HEAD "$R396")" = "$R396"
          test "$(git diff --name-only "$R396"...HEAD | grep -Ev '^(\.github/workflows/diag-switch2-horipad-o-r398-inert-nintendo-vendor\.yml|tools/diag_switch2_horipad_o_r398_inert_nintendo_vendor\.py)$' || true)" = ""
          git show "$R355:tools/diag_switch2_horipad_o_fourselect.py" > /tmp/r355-transform.py
          cmp -s /tmp/r355-transform.py tools/diag_switch2_horipad_o_fourselect.py
          git show "$R396:tools/diag_switch2_horipad_o_fourselect_r396_trace.py" > /tmp/r396-trace.py
          cmp -s /tmp/r396-trace.py tools/diag_switch2_horipad_o_fourselect_r396_trace.py

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: pip install adafruit-nrfutil intelhex

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Apply exact historical Makerdiary patch
        run: |
          set -eu
          MDK=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          git fetch origin "$MDK"
          git cherry-pick --no-commit "$MDK"
          test -z "$(git diff --name-only --diff-filter=U)"
          orig="$(git show "$MDK" --pretty=format: | git patch-id --stable | awk '{print $1}')"
          applied="$(git diff --cached | git patch-id --stable | awk '{print $1}')"
          test -n "$orig"
          test "$orig" = "$applied"
          git diff --cached --check

      - name: Reconstruct exact r396 runtime
        run: |
          set -eu
          python3 tools/diag_switch2_horipad_o_fourselect.py
          python3 tools/diag_switch2_horipad_o_fourselect_r396_trace.py
          git diff --check
          grep -q 'USBDevice.setID(0x0F0D, 0x0202)' OpenPuck/mode_switch_hori.cpp
          grep -q 'USBDevice.setProductDescriptor("HORIPAD O")' OpenPuck/mode_switch_hori.cpp
          grep -q 'sizeof SWITCH_HID_DESC == 123' OpenPuck/mode_switch_hori.cpp
          grep -q 'H4_TRACE_MAGIC = 0x36393448UL' OpenPuck/mode_switch_hori.cpp
          grep -q 'source=Switch2-HORIPAD-O-FourSelect-r396-raw' OpenPuck/mode_switch_hori.cpp
          cp OpenPuck/mode_switch_hori.cpp /tmp/r396-mode_switch_hori.cpp
          cp OpenPuck/mode_switch_hori.h /tmp/r396-mode_switch_hori.h
          cp OpenPuck/usb_app_drivers.cpp /tmp/r396-usb_app_drivers.cpp
          cp OpenPuck/usb_app_drivers.h /tmp/r396-usb_app_drivers.h
          cp OpenPuck/usb_tx.cpp /tmp/r396-usb_tx.cpp
          cp OpenPuck/OpenPuck.ino /tmp/r396-OpenPuck.ino
          cp OpenPuck/bonds.cpp /tmp/r396-bonds.cpp
          cp OpenPuck/config.cpp /tmp/r396-config.cpp
          cp Makefile /tmp/r396-Makefile

      - name: Add only inert Nintendo vendor descriptor shell
        run: |
          set -eu
          python3 tools/diag_switch2_horipad_o_r398_inert_nintendo_vendor.py
          git diff --check

      - name: Prove HORIPAD O behavior is frozen and r398 scope is narrow
        run: |
          set -eu
          grep -q 'USBDevice.setID(0x0F0D, 0x0202)' OpenPuck/mode_switch_hori.cpp
          grep -q 'USBDevice.setProductDescriptor("HORIPAD O")' OpenPuck/mode_switch_hori.cpp
          grep -q 'sizeof SWITCH_HID_DESC == 123' OpenPuck/mode_switch_hori.cpp
          grep -q 'usbTxHid(&g_switch\[u\], 0, p, 8)' OpenPuck/mode_switch_hori.cpp
          grep -q 'USBDevice.addInterface(g_h4NintendoVendor)' OpenPuck/mode_switch_hori.cpp
          grep -q 'Switch 2 Pro Controller' OpenPuck/mode_switch_hori.cpp
          grep -q 'h4TraceAppend(0xff, 4, true' OpenPuck/mode_switch_hori.cpp
          grep -q 'H4_TRACE_MAGIC = 0x38393448UL' OpenPuck/mode_switch_hori.cpp
          grep -q 'source=Switch2-HORIPAD-O-FourSelect-r398-inertvendor' OpenPuck/mode_switch_hori.cpp
          grep -q 'switchHoriInertVendorClassDriver' OpenPuck/usb_app_drivers.h
          grep -q '\*switchHoriInertVendorClassDriver()' OpenPuck/usb_app_drivers.cpp
          ! grep -q 'SW2_VENDOR_IDENTITY' OpenPuck/mode_switch_hori.cpp
          ! grep -q 'g_sw2Features' OpenPuck/mode_switch_hori.cpp
          ! grep -q 'g_sw2ActiveReport' OpenPuck/mode_switch_hori.cpp
          ! grep -q 'InternalFS' OpenPuck/mode_switch_hori.cpp
          ! grep -q 'LittleFS' OpenPuck/mode_switch_hori.cpp
          cmp -s /tmp/r396-usb_tx.cpp OpenPuck/usb_tx.cpp || { echo 'r398 changed usb_tx'; exit 1; }
          cmp -s /tmp/r396-OpenPuck.ino OpenPuck/OpenPuck.ino || { echo 'r398 changed OpenPuck.ino'; exit 1; }
          cmp -s /tmp/r396-bonds.cpp OpenPuck/bonds.cpp || { echo 'r398 changed bonds.cpp'; exit 1; }
          cmp -s /tmp/r396-config.cpp OpenPuck/config.cpp || { echo 'r398 changed config.cpp'; exit 1; }
          cmp -s /tmp/r396-Makefile Makefile || { echo 'r398 changed Makefile'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          before = Path('/tmp/r396-mode_switch_hori.cpp').read_text()
          after = Path('OpenPuck/mode_switch_hori.cpp').read_text()
          def descriptor(s):
              m = re.search(r'static const uint8_t SWITCH_HID_DESC\[\] = \{(.*?)\n\};', s, re.S)
              if not m:
                  raise SystemExit('descriptor block not found')
              return re.findall(r'0x[0-9A-Fa-f]+|\b\d+\b', m.group(1))
          if descriptor(before) != descriptor(after):
              raise SystemExit('r398 changed exact HORIPAD O descriptor bytes')
          def section(s, begin, end):
              a = s.index(begin)
              b = s.index(end, a)
              return s[a:b]
          for begin,end,label in (
              ('static void switchBuildHoripad(', 'void SwitchHoriController::begin()', 'HORIPAD report builder'),
              ('void SwitchHoriController::task()', '\n}', 'FourSelect task'),
          ):
              if section(before, begin, end) != section(after, begin, end):
                  raise SystemExit('r398 changed ' + label)
          for needle in (
              'USBDevice.setID(0x0F0D, 0x0202);',
              'USBDevice.setProductDescriptor("HORIPAD O");',
              'static const uint32_t selector[NSLOT] = { TB_L4, TB_R4, TB_L5, TB_R5 };',
              'const uint8_t neutral[8] = { 0x00, 0x00, 0x08, 0x80, 0x80, 0x80, 0x80, 0x00 };',
          ):
              if before.count(needle) != 1 or after.count(needle) != 1:
                  raise SystemExit('r396 invariant changed: ' + needle)
          print('exact HORIPAD descriptor, builder, FourSelect task, identity and routing retained')
          PY

      - name: Generate r398 build provenance
        run: |
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="SW2HORI-R398-VSHELL-${short}" ./gen_version.sh

      - name: Build standard target
        run: |
          mkdir -p build/r398-standard build/cache/r398-standard
          make build BUILD_PATH=build/cache/r398-standard OUTPUT_DIR=build/r398-standard

      - name: Build Makerdiary MDK target
        run: make build-mdk

      - name: Generate r398 MDK UF2
        run: ./gen_uf2.sh build/mdk/OpenPuck.ino.hex build/mdk/OpenPuck-Switch2-HORIPAD-O-R398-InertNintendoVendor-MDK.uf2

      - name: Validate UF2 and diagnostic markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, struct
          p = Path('build/mdk/OpenPuck-Switch2-HORIPAD-O-R398-InertNintendoVendor-MDK.uf2')
          data = p.read_bytes()
          if len(data) % 512:
              raise SystemExit('non-UF2 length')
          total = family = None
          seen = []
          image = bytearray()
          lo = 0xffffffff
          hi = 0
          for off in range(0, len(data), 512):
              b = data[off:off+512]
              m0,m1,flags,addr,size,no,nblocks,fam = struct.unpack_from('<IIIIIIII', b, 0)
              if (m0,m1) != (0x0A324655,0x9E5D5157):
                  raise SystemExit('bad UF2 magic')
              total = nblocks if total is None else total
              family = fam if family is None else family
              if nblocks != total or fam != family:
                  raise SystemExit('inconsistent UF2 metadata')
              seen.append(no)
              lo = min(lo, addr)
              hi = max(hi, addr + size)
              if addr >= 0x26000:
                  image += b[32:32+size]
          if seen != list(range(total)):
              raise SystemExit('non-sequential UF2 blocks')
          if family != 0xADA52840:
              raise SystemExit('wrong UF2 family')
          if hi > 0xEB000:
              raise SystemExit(f'UF2 reaches trace page: {hi:#x}')
          short = os.environ['GITHUB_SHA'][:8].encode()
          for needle,label in (
              (b'SW2HORI-R398-VSHELL-' + short, 'build marker'),
              (b'HORIPAD O', 'HORIPAD O identity'),
              (b'Switch 2 Pro Controller', 'inert vendor interface string'),
              (b'Switch2-HORIPAD-O-FourSelect-r398-inertvendor', 'trace source'),
              (b'# JT begin', 'JT dump'),
          ):
              if needle not in image:
                  raise SystemExit('missing ' + label)
          print('sha256', hashlib.sha256(data).hexdigest())
          print('blocks', total, 'family', hex(family), 'bytes', len(data), 'range', hex(lo)+'..'+hex(hi))
          PY

      - name: Record r398 manifest
        run: |
          cat > build/mdk/Switch2-HORIPAD-O-R398-InertNintendoVendor.manifest.txt <<EOF
          purpose=admission-threshold probe over exact hardware-positive r396 HORIPAD O FourSelect
          source_commit=${GITHUB_SHA}
          r396_authority=9256beb9c527104542f64e69a1af5647e47f773e
          r355_authority=88b8e8cd1b9d028695b99cb294b6d8826699ea2b
          runtime_base=29f4d1e8b85c0a7c19e0c8b977a1a56a2c42ea6d
          historical_mdk_patch=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          identity=0F0D:0202 HORI CO.,LTD. / HORIPAD O unchanged
          horipad_descriptor=exact preserved F16/r396 123-byte capture
          horipad_reports=exact preserved r396 8-byte FourSelect contract
          added_layer=one Pro2-shaped IAD + FF/00/00 interface + 64-byte bulk OUT/IN endpoints + Switch 2 Pro Controller interface string
          vendor_runtime=INERT; OUT traffic sunk and re-armed; no Nintendo replies/identity/features/pairing/native reports
          trace=per-HID not-ready/ready/enqueue plus vendor-interface-open; page 0xEB000 magic 0x38393448; JT dump / JC clear
          experimental_filesystem_writes=NONE
          hardware_status=PENDING
          EOF
          sha256sum build/mdk/OpenPuck-Switch2-HORIPAD-O-R398-InertNintendoVendor-MDK.uf2 >> build/mdk/Switch2-HORIPAD-O-R398-InertNintendoVendor.manifest.txt

      - name: Upload r398 diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-Switch2-HORIPAD-O-R398-InertNintendoVendor
          retention-days: 30
          if-no-files-found: error
          path: |
            build/mdk/OpenPuck-Switch2-HORIPAD-O-R398-InertNintendoVendor-MDK.uf2
            build/mdk/Switch2-HORIPAD-O-R398-InertNintendoVendor.manifest.txt
