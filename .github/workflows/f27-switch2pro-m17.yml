name: F27-M17 Switch2Pro plus generic USB mouse

on:
  push:
    branches:
      - f27-switch2pro-m17-generic-mouse
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out F27-M17
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply isolated M17 generic mouse probe
        run: python3 tools/f27_switch2pro_m17.py

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Format and verify pure reconciled experiment source
        run: |
          make format
          make check
          git diff --check
          test ! -e OpenPuck/git_version.h
          test "$(git diff --name-only)" = "OpenPuck/mode_switch2_pro.cpp"
          grep -q 'F27-M17-PRO-GENERIC-HID-MOUSE' OpenPuck/mode_switch2_pro.cpp
          grep -q 'USBDevice.addInterface(g_sw2Usb)' OpenPuck/mode_switch2_pro.cpp
          grep -q 'USBDevice.addInterface(g_m17Mouse)' OpenPuck/mode_switch2_pro.cpp
          grep -q 'm17GenericMouseTask' OpenPuck/mode_switch2_pro.cpp

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build Python packages
        # Keep both packages intentionally unpinned, matching project policy.
        run: pip install adafruit-nrfutil intelhex

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Build standard F27-M17 target
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-M17-USBMOUSE-${short}" ./gen_version.sh
          mkdir -p build/f27-standard build/cache/f27-standard
          make build \
            BUILD_PATH=build/cache/f27-standard \
            OUTPUT_DIR=build/f27-standard
          ./gen_uf2.sh build/f27-standard/OpenPuck.ino.hex \
            build/f27-standard/OpenPuck-F27-M17-ProGenericMouse-standard.uf2
          cp build/f27-standard/OpenPuck-F27-M17-ProGenericMouse-standard.uf2 /tmp/
          cp build/f27-standard/OpenPuck.ino.hex /tmp/OpenPuck-F27-M17-standard.hex

      - name: Compose current-main Makerdiary support
        run: |
          set -eu
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git fetch origin 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          git cherry-pick --no-commit 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Reapply M17 over Makerdiary build composition
        run: |
          python3 tools/f27_switch2pro_m17.py
          make format
          make check
          git diff --check
          test ! -e OpenPuck/git_version.h
          grep -q 'OPK_BOARD_MDK_USB_DONGLE' Makefile
          grep -q 'F27-M17-PRO-GENERIC-HID-MOUSE' OpenPuck/mode_switch2_pro.cpp

      - name: Build Makerdiary MDK F27-M17 target
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-M17-USBMOUSE-${short}" ./gen_version.sh
          make build-mdk
          ./gen_uf2.sh build/mdk/OpenPuck.ino.hex \
            build/mdk/OpenPuck-F27-M17-ProGenericMouse-MDK.uf2
          mkdir -p build/f27-standard
          cp /tmp/OpenPuck-F27-M17-ProGenericMouse-standard.uf2 build/f27-standard/
          cp /tmp/OpenPuck-F27-M17-standard.hex build/f27-standard/OpenPuck.ino.hex

      - name: Validate M17 artifact identity
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import struct

          def inspect(path):
              data = Path(path).read_bytes()
              if len(data) % 512:
                  raise SystemExit(f"non-UF2 length: {path}")
              payloads = []
              addrs = []
              total = None
              family = None
              for off in range(0, len(data), 512):
                  b = data[off:off+512]
                  m0, m1, flags, addr, size, no, nblocks, fam = struct.unpack_from("<IIIIIIII", b, 0)
                  if (m0, m1) != (0x0A324655, 0x9E5D5157):
                      raise SystemExit(f"bad UF2 magic in {path}")
                  if size > 476:
                      raise SystemExit(f"bad UF2 payload size in {path}")
                  total = nblocks if total is None else total
                  family = fam if family is None else family
                  if nblocks != total or fam != family:
                      raise SystemExit(f"inconsistent UF2 metadata in {path}")
                  if addr >= 0x26000:
                      payloads.append(b[32:32+size])
                      addrs.append(addr)
              image = b"".join(payloads)
              if b"F27-M17-PRO-GENERIC-HID-MOUSE" not in image:
                  raise SystemExit(f"missing M17 marker in {path}")
              if b"F27-M17-USBMOUSE-" not in image:
                  raise SystemExit(f"missing M17 build label in {path}")
              print(path, "PASS", "blocks", total, "family", hex(family),
                    "range", hex(min(addrs)), hex(max(addrs)+256))

          for p in [
              "build/f27-standard/OpenPuck-F27-M17-ProGenericMouse-standard.uf2",
              "build/mdk/OpenPuck-F27-M17-ProGenericMouse-MDK.uf2",
          ]:
              inspect(p)
          PY

      - name: Record experiment manifest
        run: |
          cat > build/F27-M17-ProGenericMouse.manifest.txt <<EOF
          source_commit=${{ github.sha }}
          runtime_base=1b4c0fae82489ab6034004c69ed6c8979268eb03
          runtime_base_tree=530264b182ea3f3f9b7bbbc32670039d01b40eea
          makerdiary_authority=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          makerdiary_current_main_composition=96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          target=F27-M17-ProGenericMouse
          prior_m16=single Switch2Pro visible; hidden Joy-Con2-R report08 mouse FAIL
          purpose=test standard USB HID mouse alongside the visible Switch2Pro controller
          topology=Switch2Pro captured composite remains first IF0-4 EP1-3; standard boot mouse appended afterward
          mouse_source=right Steam trackpad, slot0
          mouse_model=existing OpenPuck XInput right-pad glide/scaling model
          mouse_buttons=right-pad click left mouse; left-pad click right mouse
          important_test_constraint=standard USB mouse is documented/demonstrated for mouse-compatible software but may not navigate Switch2 HOME; test inside known mouse-compatible software
          success=visible Switch2Pro remains stable and right trackpad moves software mouse cursor
          fail=Switch2Pro stable but right trackpad does not move cursor in software already verified with a physical USB mouse
          EOF
          sha256sum build/f27-standard/OpenPuck-F27-M17-ProGenericMouse-standard.uf2 >> build/F27-M17-ProGenericMouse.manifest.txt
          sha256sum build/mdk/OpenPuck-F27-M17-ProGenericMouse-MDK.uf2 >> build/F27-M17-ProGenericMouse.manifest.txt

      - name: Upload F27-M17 target
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-F27-M17-ProGenericMouse
          retention-days: 30
          if-no-files-found: error
          path: |
            build/f27-standard/OpenPuck-F27-M17-ProGenericMouse-standard.uf2
            build/f27-standard/OpenPuck.ino.hex
            build/mdk/OpenPuck-F27-M17-ProGenericMouse-MDK.uf2
            build/mdk/OpenPuck.ino.hex
            build/F27-M17-ProGenericMouse.manifest.txt
