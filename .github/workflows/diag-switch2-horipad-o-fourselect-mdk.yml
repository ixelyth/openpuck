name: Switch 2 HORIPAD O FourSelect MDK diagnostic

on:
  push:
    branches:
      - diag-switch-horipad-four-select-mdk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact legacy FourSelect base ancestry
        run: |
          set -eu
          BASE=29f4d1e8b85c0a7c19e0c8b977a1a56a2c42ea6d
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test -f tools/diag_switch2_horipad_o_fourselect.py
          test "$(git diff --name-only "$BASE"...HEAD | grep -Ev '^(\.github/workflows/|tools/)' || true)" = ""

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: pip install adafruit-nrfutil intelhex

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Apply Makerdiary MDK support only
        run: |
          set -eu
          MDK=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          git fetch origin "$MDK"
          git cherry-pick --no-commit "$MDK"
          test -z "$(git diff --name-only --diff-filter=U)"
          orig="$(git show "$MDK" --pretty=format: | git patch-id --stable | awk '{print $1}')"
          applied="$(git diff --cached | git patch-id --stable | awk '{print $1}')"
          test -n "$orig"
          test "$orig" = "$applied"
          git diff --cached --check

      - name: Apply Switch 2 HORIPAD O FourSelect transform
        run: |
          set -eu
          python3 tools/diag_switch2_horipad_o_fourselect.py
          git diff --check
          test "$(git diff --name-only | grep -c '^OpenPuck/mode_switch_hori.cpp$')" -eq 1
          grep -q 'USBDevice.setID(0x0F0D, 0x0202)' OpenPuck/mode_switch_hori.cpp
          grep -q 'USBDevice.setProductDescriptor("HORIPAD O")' OpenPuck/mode_switch_hori.cpp
          grep -q 'sizeof SWITCH_HID_DESC == 123' OpenPuck/mode_switch_hori.cpp
          grep -q 'TB_L4, TB_R4, TB_L5, TB_R5' OpenPuck/mode_switch_hori.cpp
          grep -q '#define NSLOT 4' OpenPuck/bonds.h

      - name: Generate diagnostic build provenance
        run: OPK_BUILD_VERSION="SW2HORI4SEL-MDK-29f4" ./gen_version.sh

      - name: Build standard target
        run: |
          mkdir -p build/diag-standard build/cache/diag-standard
          make build BUILD_PATH=build/cache/diag-standard OUTPUT_DIR=build/diag-standard

      - name: Build Makerdiary MDK target
        run: make build-mdk

      - name: Generate MDK UF2
        run: ./gen_uf2.sh build/mdk/OpenPuck.ino.hex build/mdk/OpenPuck-Switch2-HORIPAD-O-FourSelect-MDK.uf2

      - name: Validate UF2 and identity marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('build/mdk/OpenPuck-Switch2-HORIPAD-O-FourSelect-MDK.uf2')
          data=p.read_bytes()
          if len(data)%512: raise SystemExit('non-UF2 length')
          total=family=None; seen=[]; image=bytearray(); addrs=[]
          for off in range(0,len(data),512):
              b=data[off:off+512]
              m0,m1,flags,addr,size,no,nblocks,fam=struct.unpack_from('<IIIIIIII',b,0)
              if (m0,m1)!=(0x0A324655,0x9E5D5157): raise SystemExit('bad magic')
              total=nblocks if total is None else total
              family=fam if family is None else family
              if nblocks!=total or fam!=family: raise SystemExit('inconsistent metadata')
              seen.append(no); addrs.append(addr)
              if addr>=0x26000: image+=b[32:32+size]
          if seen!=list(range(total)): raise SystemExit('non-sequential blocks')
          if family!=0xADA52840: raise SystemExit('wrong family')
          if b'SW2HORI4SEL-MDK-29f4' not in image: raise SystemExit('missing build marker')
          if b'HORIPAD O' not in image: raise SystemExit('missing HORIPAD O string')
          print('PASS',len(data),total,hex(min(addrs)),hex(max(addrs)+256))
          PY

      - name: Record manifest
        run: |
          cat > build/mdk/Switch2-HORIPAD-O-FourSelect.manifest.txt <<'EOF'
          purpose=Switch 2 HORIPAD O same-address four-controller FourSelect discriminator
          runtime_base=29f4d1e8b85c0a7c19e0c8b977a1a56a2c42ea6d
          mdk_patch=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          identity=0F0D:0202 HORI CO.,LTD. / HORIPAD O
          descriptor=exact preserved F16 123-byte capture
          report_mapping=preserved F16 8-byte HORIPAD O contract
          hid_count=4
          default=all four neutral
          selector_L4=controller_1
          selector_R4=controller_2
          selector_L5=controller_3
          selector_R5=controller_4
          selector_paddle=suppressed
          ambiguous_multiple_selectors=all neutral
          rf_source=one live Steam Controller cloned selectively
          mode_selection=legacy HORIPAD mode 2 (diagnostic swaps its USB identity/report contract only)
          EOF
          sha256sum build/mdk/OpenPuck.ino.hex >> build/mdk/Switch2-HORIPAD-O-FourSelect.manifest.txt
          sha256sum build/mdk/OpenPuck-Switch2-HORIPAD-O-FourSelect-MDK.uf2 >> build/mdk/Switch2-HORIPAD-O-FourSelect.manifest.txt
          git diff -- OpenPuck/mode_switch_hori.cpp > build/mdk/Switch2-HORIPAD-O-FourSelect.patch

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-Switch2-HORIPAD-O-FourSelect-MDK
          retention-days: 30
          if-no-files-found: error
          path: |
            build/mdk/OpenPuck-Switch2-HORIPAD-O-FourSelect-MDK.uf2
            build/mdk/OpenPuck.ino.hex
            build/mdk/Switch2-HORIPAD-O-FourSelect.manifest.txt
            build/mdk/Switch2-HORIPAD-O-FourSelect.patch
