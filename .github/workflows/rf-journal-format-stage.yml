name: Temporary format RF journal staging changes

on:
  push:
    branches:
      - rf-recovery-journal-persist-stage
    paths:
      - '.github/workflows/rf-journal-format-stage.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rf-recovery-journal-persist-stage
          fetch-depth: 0
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Format only RF files changed by this patch
        run: |
          clang-format-18 -i \
            OpenPuck/rf_journal_layout.h \
            OpenPuck/rf_link.cpp \
            OpenPuck/rf_link.h \
            OpenPuck/fw_update.cpp \
            OpenPuck/webusb_config.cpp
          git diff --check
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add OpenPuck/rf_journal_layout.h OpenPuck/rf_link.cpp OpenPuck/rf_link.h OpenPuck/fw_update.cpp OpenPuck/webusb_config.cpp
          git commit -m 'Format RF journal persistence changes'
          git push origin HEAD:rf-recovery-journal-persist-stage
