name: F27-J3 PID2068 full common report 05

on:
  push:
    branches:
      - f27-joycon2-j3-pid2068-full05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out J3
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compose hardware-positive JCR plus J2 plus J3
        run: |
          set -eu
          python3 tools/f27_joycon2_poc.py
          python3 tools/f27_joycon2_m1.py
          python3 tools/f27_joycon2_m2.py
          python3 tools/f27_joycon2_m3.py
          python3 tools/f27_joycon2_j2_full05.py
          python3 tools/f27_joycon2_j3_pid2068.py

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Format and verify J3 source
        run: |
          make format
          make check
          git diff --check
          test ! -e OpenPuck/git_version.h
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' OpenPuck/f27_joycon2.cpp OpenPuck/f27_joycon2.h OpenPuck/mode_switch2_pro.cpp | sort)"
          grep -q 'F27-J3-PID2068-FULL05' OpenPuck/mode_switch2_pro.cpp
          grep -q 'USBDevice.setID(0x057e, 0x2068)' OpenPuck/mode_switch2_pro.cpp
          grep -q 'return 0x68' OpenPuck/f27_joycon2.cpp
          grep -q '#define F27_JOYCON_DEFAULT_REPORT 0x05' OpenPuck/f27_joycon2.h
          grep -q 'bool requestedMouse = false' OpenPuck/f27_joycon2.cpp
          grep -q 'memset(out + 0x2a, 0, 21)' OpenPuck/mode_switch2_pro.cpp

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install build Python packages
        run: pip install adafruit-nrfutil intelhex
      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Build standard J3
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-J3-2068-${short}" ./gen_version.sh
          mkdir -p build/f27-standard build/cache/f27-standard
          make build BUILD_PATH=build/cache/f27-standard OUTPUT_DIR=build/f27-standard EXTRA_FLAGS="-DOPK_F27_JOYCON_TARGET=2"
          ./gen_uf2.sh build/f27-standard/OpenPuck.ino.hex build/f27-standard/OpenPuck-F27-J3-PID2068-Full05-standard.uf2
          cp build/f27-standard/OpenPuck-F27-J3-PID2068-Full05-standard.uf2 /tmp/
          cp build/f27-standard/OpenPuck.ino.hex /tmp/OpenPuck-F27-J3-standard.hex

      - name: Compose Makerdiary MDK support
        run: |
          set -eu
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git fetch origin 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          git cherry-pick --no-commit 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          python3 tools/f27_joycon2_poc.py
          python3 tools/f27_joycon2_m1.py
          python3 tools/f27_joycon2_m2.py
          python3 tools/f27_joycon2_m3.py
          python3 tools/f27_joycon2_j2_full05.py
          python3 tools/f27_joycon2_j3_pid2068.py
          make format
          make check
          git diff --check
          grep -q 'OPK_BOARD_MDK_USB_DONGLE' Makefile
          grep -q 'F27-J3-PID2068-FULL05' OpenPuck/mode_switch2_pro.cpp

      - name: Build Makerdiary MDK J3
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-J3-2068-${short}" ./gen_version.sh
          make build-mdk EXTRA_FLAGS="-DOPK_F27_JOYCON_TARGET=2"
          ./gen_uf2.sh build/mdk/OpenPuck.ino.hex build/mdk/OpenPuck-F27-J3-PID2068-Full05-MDK.uf2
          mkdir -p build/f27-standard
          cp /tmp/OpenPuck-F27-J3-PID2068-Full05-standard.uf2 build/f27-standard/
          cp /tmp/OpenPuck-F27-J3-standard.hex build/f27-standard/OpenPuck.ino.hex

      - name: Validate J3 artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, os
          marker=b'F27-J3-PID2068-FULL05'
          build=("F27-J3-2068-"+os.environ['GITHUB_SHA'][:8]).encode()
          for path in ['build/f27-standard/OpenPuck-F27-J3-PID2068-Full05-standard.uf2','build/mdk/OpenPuck-F27-J3-PID2068-Full05-MDK.uf2']:
              data=Path(path).read_bytes(); image=bytearray(); seen=[]; total=None; fam=None
              if len(data)%512: raise SystemExit('bad UF2 length')
              for off in range(0,len(data),512):
                  b=data[off:off+512]; m0,m1,flags,addr,size,no,nblocks,family=struct.unpack_from('<IIIIIIII',b,0)
                  if (m0,m1)!=(0x0A324655,0x9E5D5157): raise SystemExit('bad magic')
                  total=nblocks if total is None else total; fam=family if fam is None else fam
                  if nblocks!=total or family!=fam: raise SystemExit('metadata mismatch')
                  seen.append(no)
                  if addr>=0x26000: image += b[32:32+size]
              if seen != list(range(total)): raise SystemExit('nonsequential UF2')
              if marker not in image or build not in image: raise SystemExit('missing J3 identity')
              print(path,'PASS','blocks',total,'family',hex(fam))
          PY

      - name: Record J3 manifest
        run: |
          cat > build/F27-J3-PID2068-Full05.manifest.txt <<EOF
          source_commit=${{ github.sha }}
          hardware_positive_jcr_base=6c2e191693fec0baadeeda8938275e6d04a5463b
          usb_pid=057e:2068
          logical_factory_pid=2068
          transport_descriptor=lineage remains captured Nintendo Switch2 transport; no invented Charging Grip descriptor
          periodic_report=0x05
          payload=full left+right ordinary Steam controls
          mouse=disabled
          motion_payload=zeroed
          purpose=test whether PID2068 receives special combined-pair handling on Switch2 despite public hub implementations
          EOF
          sha256sum build/f27-standard/OpenPuck-F27-J3-PID2068-Full05-standard.uf2 >> build/F27-J3-PID2068-Full05.manifest.txt
          sha256sum build/mdk/OpenPuck-F27-J3-PID2068-Full05-MDK.uf2 >> build/F27-J3-PID2068-Full05.manifest.txt

      - name: Upload J3
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-F27-J3-PID2068-Full05
          retention-days: 30
          if-no-files-found: error
          path: |
            build/f27-standard/OpenPuck-F27-J3-PID2068-Full05-standard.uf2
            build/mdk/OpenPuck-F27-J3-PID2068-Full05-MDK.uf2
            build/F27-J3-PID2068-Full05.manifest.txt
