name: F27-M15 dual Switch2Pro + Joy-Con 2 R topology probe

on:
  push:
    branches:
      - f27-switch2pro-m15-dual-session
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out F27-M15
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply isolated M15 dual-session topology probe
        run: python3 tools/f27_switch2pro_m15.py

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Format and verify pure reconciled experiment source
        run: |
          make format
          make check
          git diff --check
          test ! -e OpenPuck/git_version.h
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' OpenPuck/OpenPuck.ino OpenPuck/mode_switch2_pro.cpp | sort)"
          grep -q 'M15_SW2_SESSION_COUNT = 2' OpenPuck/mode_switch2_pro.cpp
          grep -q 'F27-M15-DUAL-S2-TOPOLOGY' OpenPuck/mode_switch2_pro.cpp
          grep -q 'g_usbCfgDesc\[768\]' OpenPuck/OpenPuck.ino

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build Python packages
        # Keep both packages intentionally unpinned, matching project policy.
        run: pip install adafruit-nrfutil intelhex

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Build standard F27-M15 target
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-M15-DUAL-${short}" ./gen_version.sh
          mkdir -p build/f27-standard build/cache/f27-standard
          make build \
            BUILD_PATH=build/cache/f27-standard \
            OUTPUT_DIR=build/f27-standard
          ./gen_uf2.sh build/f27-standard/OpenPuck.ino.hex \
            build/f27-standard/OpenPuck-F27-M15-DualS2Topology-standard.uf2
          cp build/f27-standard/OpenPuck-F27-M15-DualS2Topology-standard.uf2 /tmp/
          cp build/f27-standard/OpenPuck.ino.hex /tmp/OpenPuck-F27-M15-standard.hex

      - name: Compose current-main Makerdiary support
        run: |
          set -eu
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git fetch origin 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          git cherry-pick --no-commit 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Reapply M15 over Makerdiary build composition
        run: |
          python3 tools/f27_switch2pro_m15.py
          make format
          make check
          git diff --check
          test ! -e OpenPuck/git_version.h
          grep -q 'OPK_BOARD_MDK_USB_DONGLE' Makefile
          grep -q 'M15_SW2_SESSION_COUNT = 2' OpenPuck/mode_switch2_pro.cpp

      - name: Build Makerdiary MDK F27-M15 target
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-M15-DUAL-${short}" ./gen_version.sh
          make build-mdk
          ./gen_uf2.sh build/mdk/OpenPuck.ino.hex \
            build/mdk/OpenPuck-F27-M15-DualS2Topology-MDK.uf2
          mkdir -p build/f27-standard
          cp /tmp/OpenPuck-F27-M15-DualS2Topology-standard.uf2 build/f27-standard/
          cp /tmp/OpenPuck-F27-M15-standard.hex build/f27-standard/OpenPuck.ino.hex

      - name: Validate M15 artifact identity
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import struct

          def inspect(path):
              data = Path(path).read_bytes()
              if len(data) % 512:
                  raise SystemExit(f"non-UF2 length: {path}")
              payloads = []
              addrs = []
              total = None
              family = None
              for off in range(0, len(data), 512):
                  b = data[off:off+512]
                  m0, m1, flags, addr, size, no, nblocks, fam = struct.unpack_from("<IIIIIIII", b, 0)
                  if (m0, m1) != (0x0A324655, 0x9E5D5157):
                      raise SystemExit(f"bad UF2 magic in {path}")
                  if size > 476:
                      raise SystemExit(f"bad UF2 payload size in {path}")
                  total = nblocks if total is None else total
                  family = fam if family is None else family
                  if nblocks != total or fam != family:
                      raise SystemExit(f"inconsistent UF2 metadata in {path}")
                  if addr >= 0x26000:
                      payloads.append(b[32:32+size])
                      addrs.append(addr)
              image = b"".join(payloads)
              marker = b"F27-M15-DUAL-S2-TOPOLOGY"
              build = b"F27-M15-DUAL-"
              if marker not in image or build not in image:
                  raise SystemExit(f"missing M15 marker in {path}")
              print(path, "PASS", "blocks", total, "family", hex(family),
                    "range", hex(min(addrs)), hex(max(addrs)+256))

          for p in [
              "build/f27-standard/OpenPuck-F27-M15-DualS2Topology-standard.uf2",
              "build/mdk/OpenPuck-F27-M15-DualS2Topology-MDK.uf2",
          ]:
              inspect(p)
          PY

      - name: Record experiment manifest
        run: |
          cat > build/F27-M15-DualS2Topology.manifest.txt <<EOF
          source_commit=${{ github.sha }}
          runtime_base=1b4c0fae82489ab6034004c69ed6c8979268eb03
          runtime_base_tree=530264b182ea3f3f9b7bbbc32670039d01b40eea
          makerdiary_authority=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          makerdiary_current_main_composition=96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          target=F27-M15-DualS2Topology
          prior_m14=Switch2Pro identity PASS; common-report05 right-trackpad mouse FAIL
          purpose=topology-only proof that one OpenPuck USB address can register two independent Switch2 controller functions
          physical_usb_identity=057E:2069 Switch 2 Pro Controller, shared EP0 identity
          session0=full existing Switch2Pro composite IF0-4 EP1-3, normal controls/rumble/report09-or05
          session1=neutral Joy-Con2-R logical session IF5-9 EP4-6, factory PID2066, Joy-Con feature semantics, native report08
          joycon_ep0_caveat=EP0 device-level identity remains Pro because one USB address has one device descriptor; M15 tests whether per-function vendor/factory session identity is sufficient
          mouse_routing=none; intentionally deferred until dual-controller registration is proven
          physical_bonding=one connected Steam controller feeds Pro session; Joy-Con companion remains neutral
          success=Change Grip/Order shows two controller slots, ideally Switch2Pro plus Joy-Con2-R
          partial=two controllers appear but both classify as Pro or second identity differs
          fail=only one controller appears or USB enumeration fails
          EOF
          sha256sum build/f27-standard/OpenPuck-F27-M15-DualS2Topology-standard.uf2 >> build/F27-M15-DualS2Topology.manifest.txt
          sha256sum build/mdk/OpenPuck-F27-M15-DualS2Topology-MDK.uf2 >> build/F27-M15-DualS2Topology.manifest.txt

      - name: Upload F27-M15 target
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-F27-M15-DualS2Topology
          retention-days: 30
          if-no-files-found: error
          path: |
            build/f27-standard/OpenPuck-F27-M15-DualS2Topology-standard.uf2
            build/f27-standard/OpenPuck.ino.hex
            build/mdk/OpenPuck-F27-M15-DualS2Topology-MDK.uf2
            build/mdk/OpenPuck.ino.hex
            build/F27-M15-DualS2Topology.manifest.txt
