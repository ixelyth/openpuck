name: F27-M20 reconciled Joy-Con 2 R control

on:
  push:
    branches:
      - f27-switch2pro-m20-jcr-control
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out F27-M20
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply hardware-proven Joy-Con R chain
        run: |
          python3 tools/f27_joycon2_poc.py
          python3 tools/f27_joycon2_m1.py
          python3 tools/f27_joycon2_m2.py
          python3 tools/f27_joycon2_m3.py

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Format and verify reconciled control source
        run: |
          make format
          make check
          git diff --check
          test ! -e OpenPuck/git_version.h
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' OpenPuck/f27_joycon2.cpp OpenPuck/mode_switch2_pro.cpp | sort)"
          grep -q 'bool requestedMouse = true' OpenPuck/f27_joycon2.cpp
          grep -q 'if (surface)' OpenPuck/f27_joycon2.cpp
          grep -q 'f27JoyconPatchIdentity' OpenPuck/mode_switch2_pro.cpp

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build Python packages
        run: pip install adafruit-nrfutil intelhex

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Build standard F27-M20 R target
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-M20-JCRCTRL-${short}" ./gen_version.sh
          mkdir -p build/f27-standard build/cache/f27-standard
          make build \
            BUILD_PATH=build/cache/f27-standard \
            OUTPUT_DIR=build/f27-standard \
            EXTRA_FLAGS="-DOPK_F27_JOYCON_TARGET=2"
          ./gen_uf2.sh build/f27-standard/OpenPuck.ino.hex \
            build/f27-standard/OpenPuck-F27-M20-JoyCon2-R-standard.uf2
          cp build/f27-standard/OpenPuck-F27-M20-JoyCon2-R-standard.uf2 /tmp/
          cp build/f27-standard/OpenPuck.ino.hex /tmp/OpenPuck-F27-M20-standard.hex

      - name: Compose current-main Makerdiary support
        run: |
          set -eu
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git fetch origin 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          git cherry-pick --no-commit 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Reapply Joy-Con R chain over MDK composition
        run: |
          python3 tools/f27_joycon2_poc.py
          python3 tools/f27_joycon2_m1.py
          python3 tools/f27_joycon2_m2.py
          python3 tools/f27_joycon2_m3.py
          make format
          make check
          git diff --check
          test ! -e OpenPuck/git_version.h
          grep -q 'OPK_BOARD_MDK_USB_DONGLE' Makefile
          grep -q 'bool requestedMouse = true' OpenPuck/f27_joycon2.cpp

      - name: Build Makerdiary MDK F27-M20 R target
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-M20-JCRCTRL-${short}" ./gen_version.sh
          make build-mdk EXTRA_FLAGS="-DOPK_F27_JOYCON_TARGET=2"
          ./gen_uf2.sh build/mdk/OpenPuck.ino.hex \
            build/mdk/OpenPuck-F27-M20-JoyCon2-R-MDK.uf2
          mkdir -p build/f27-standard
          cp /tmp/OpenPuck-F27-M20-JoyCon2-R-standard.uf2 build/f27-standard/
          cp /tmp/OpenPuck-F27-M20-standard.hex build/f27-standard/OpenPuck.ino.hex

      - name: Validate M20 artifact identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, os
          marker = ("F27-M20-JCRCTRL-" + os.environ["GITHUB_SHA"][:8]).encode()
          for path in [
              'build/f27-standard/OpenPuck-F27-M20-JoyCon2-R-standard.uf2',
              'build/mdk/OpenPuck-F27-M20-JoyCon2-R-MDK.uf2',
          ]:
              data = Path(path).read_bytes()
              if len(data) % 512: raise SystemExit(f'non-UF2 length: {path}')
              image=bytearray(); seen=[]; total=None; family=None; addrs=[]
              for off in range(0,len(data),512):
                  b=data[off:off+512]
                  m0,m1,flags,addr,size,no,nblocks,fam=struct.unpack_from('<IIIIIIII',b,0)
                  if (m0,m1)!=(0x0A324655,0x9E5D5157): raise SystemExit(f'bad UF2 magic: {path}')
                  total=nblocks if total is None else total; family=fam if family is None else family
                  if nblocks!=total or fam!=family: raise SystemExit(f'inconsistent UF2 metadata: {path}')
                  seen.append(no)
                  if addr>=0x26000:
                      image += b[32:32+size]; addrs.append(addr)
              if seen != list(range(total)): raise SystemExit(f'non-sequential blocks: {path}')
              if marker not in image: raise SystemExit(f'missing M20 build label: {path}')
              print(path,'PASS','blocks',total,'family',hex(family),'range',hex(min(addrs)),hex(max(addrs)+256))
          PY

      - name: Record experiment manifest
        run: |
          cat > build/F27-M20-JoyCon2-R.manifest.txt <<EOF
          source_commit=${{ github.sha }}
          runtime_base=1b4c0fae82489ab6034004c69ed6c8979268eb03
          historical_hardware_lkg=1fecb47401ed9fb7bdb22b8c6fe4707575411250
          makerdiary_authority=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          makerdiary_current_main_composition=96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          target=JoyCon2-R-M20-current-base-control
          define=2
          purpose=reproduce hardware-proven M3 Joy-Con 2 R identity/report08/mouse behavior on switch2pro-reconcile-main before dual-Joy-Con topology testing
          expected=one visible usable Joy-Con 2 R; right trackpad mouse works as in historical M3
          EOF
          sha256sum build/f27-standard/OpenPuck-F27-M20-JoyCon2-R-standard.uf2 >> build/F27-M20-JoyCon2-R.manifest.txt
          sha256sum build/mdk/OpenPuck-F27-M20-JoyCon2-R-MDK.uf2 >> build/F27-M20-JoyCon2-R.manifest.txt

      - name: Upload F27-M20 target
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-F27-M20-JoyCon2-R
          retention-days: 30
          if-no-files-found: error
          path: |
            build/f27-standard/OpenPuck-F27-M20-JoyCon2-R-standard.uf2
            build/f27-standard/OpenPuck.ino.hex
            build/mdk/OpenPuck-F27-M20-JoyCon2-R-MDK.uf2
            build/mdk/OpenPuck.ino.hex
            build/F27-M20-JoyCon2-R.manifest.txt