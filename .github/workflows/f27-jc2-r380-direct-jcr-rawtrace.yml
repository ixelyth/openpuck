name: F27 JC2 R380 direct JCR raw trace

on:
  push:
    branches:
      - f27-jc2-r380-direct-jcr-rawtrace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build Python packages
        run: pip install adafruit-nrfutil intelhex

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Compose exact r379 r374 volatile runtime
        run: |
          set -eu
          git fetch origin 96721b9bf50fbb92fc956853b8ef73dcf2ae973c 0d61497a5fcebc697a502946b1b76419e9a0c61c
          git cherry-pick --no-commit 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 tools/f27_g5_integrate.py
          python3 tools/f27_g5_re_refresh.py
          python3 tools/f27_jc2_init_fidelity.py
          python3 tools/f27_jc2_ab_common_fix.py
          python3 tools/f27_jc2_ab_make_nonclean.py
          python3 tools/f27_jc2_r379_volatile_start.py
          make format
          make check
          git diff --check
          cp OpenPuck/mode_joycon2.cpp /tmp/r379-mode_joycon2.cpp
          cp OpenPuck/config.cpp /tmp/r379-config.cpp
          cp OpenPuck/bonds.cpp /tmp/r379-bonds.cpp
          cp Makefile /tmp/r379-Makefile
          git show 0d61497a5fcebc697a502946b1b76419e9a0c61c:tools/f27_jc2_persistent_trace.py > /tmp/f27_jc2_persistent_trace.py

      - name: Apply r375 observers then raw-page persistence
        run: |
          set -eu
          python3 /tmp/f27_jc2_persistent_trace.py
          sed -i 's/persistent tag or save this override/persistent startup tag or save this override/' tools/f27_jc2_r380_raw_trace.py
          python3 tools/f27_jc2_r380_raw_trace.py
          sed -i '/#include "controllers.h"/a #include "mode_joycon2.h"' OpenPuck/OpenPuck.ino
          make format
          make check
          git diff --check

      - name: Prove protocol identity and bond isolation
        run: |
          set -eu
          grep -q 'F27-JC2-R374-INIT-PAIRING-FIDELITY' OpenPuck/mode_joycon2.cpp
          grep -q 'JC2_TRACE_RAW_PAGE = 0x000EB000UL' OpenPuck/mode_joycon2.cpp
          grep -q 'JC2_TRACE_RAW_MAGIC = 0x3038544AUL' OpenPuck/mode_joycon2.cpp
          grep -q 'source=JCR-direct-r380-raw' OpenPuck/mode_joycon2.cpp
          grep -q 'joyCon2TraceHasSnapshot' OpenPuck/mode_joycon2.cpp
          grep -q 'joyCon2TraceHasSnapshot' OpenPuck/OpenPuck.ino
          grep -q '#include "mode_joycon2.h"' OpenPuck/OpenPuck.ino
          grep -q '10000u' OpenPuck/mode_joycon2.cpp
          grep -q '5000u' OpenPuck/mode_joycon2.cpp
          grep -q 'strcmp(line, "JT")' OpenPuck/serial_console.cpp
          grep -q 'strcmp(line, "JC")' OpenPuck/serial_console.cpp
          ! grep -q 'JC2_TRACE_FILE' OpenPuck/mode_joycon2.cpp
          ! grep -q 'JC2_TRACE_TAG' OpenPuck/mode_joycon2.cpp
          ! grep -q 'Adafruit_LittleFS' OpenPuck/mode_joycon2.cpp
          ! grep -q 'InternalFileSystem' OpenPuck/mode_joycon2.cpp
          ! grep -q 'InternalFS' OpenPuck/mode_joycon2.cpp
          ! grep -q '/jc2mode' OpenPuck/OpenPuck.ino
          ! grep -q '/jc2trace' OpenPuck/OpenPuck.ino
          grep -q '#define FWUP_META 0xEC000UL' OpenPuck/fw_update.cpp
          grep -q '#define FWUP_FS_BASE 0xED000UL' OpenPuck/fw_update.cpp
          cmp -s /tmp/r379-config.cpp OpenPuck/config.cpp || { echo 'config.cpp drifted'; exit 1; }
          cmp -s /tmp/r379-bonds.cpp OpenPuck/bonds.cpp || { echo 'bonds.cpp drifted'; exit 1; }
          cmp -s /tmp/r379-Makefile Makefile || { echo 'Makefile drifted'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          before=Path('/tmp/r379-mode_joycon2.cpp').read_text()
          after=Path('OpenPuck/mode_joycon2.cpp').read_text()
          def compact(s): return re.sub(r'\s+', '', s)
          def arr(src,name):
              m=re.search(r'static const uint8_t '+re.escape(name)+r'\[[^\]]*\] = \{.*?\n\};',src,re.S)
              if not m: raise SystemExit('missing '+name)
              return compact(m.group(0))
          for name in ('JOYCON2_HID_DESC','JOYCON2_CFG_BODY'):
              if arr(before,name) != arr(after,name):
                  raise SystemExit('R380 changed r379/r374 USB constant '+name)
          prep=re.search(r'static void jc2TracePrepare\(\)\n\{(.*?)\n\}', after, re.S)
          if not prep: raise SystemExit('missing jc2TracePrepare')
          for bad in ('NRF_NVMC','jc2TraceRawErase','jc2TraceRawStore','InternalFS','File '):
              if bad in prep.group(1): raise SystemExit('R380 startup trace mutates storage: '+bad)
          print('R380 direct-JCR raw trace scope PASS')
          PY

      - name: Build Makerdiary r380 direct JCR raw trace
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-R380-JCR-RAW-${short}" ./gen_version.sh
          make build-mdk EXTRA_FLAGS="-DOPK_JC2_VOLATILE_START=1 -DOPK_G5_JOYCON_SIDE=2"
          ./gen_uf2.sh build/mdk/OpenPuck.ino.hex build/mdk/OpenPuck-F27-R380-DirectJCR-RawTrace-MDK.uf2

      - name: Validate UF2 and scratch-page separation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, os
          p=Path('build/mdk/OpenPuck-F27-R380-DirectJCR-RawTrace-MDK.uf2')
          data=p.read_bytes(); image=bytearray(); seen=[]; total=None; fam=None; max_end=0; min_addr=0xffffffff
          if len(data)%512: raise SystemExit('bad UF2 length')
          for off in range(0,len(data),512):
              b=data[off:off+512]
              m0,m1,flags,addr,size,no,nblocks,family=struct.unpack_from('<IIIIIIII',b,0)
              if (m0,m1)!=(0x0A324655,0x9E5D5157): raise SystemExit('bad UF2 magic')
              total=nblocks if total is None else total
              fam=family if fam is None else fam
              if nblocks!=total or family!=fam: raise SystemExit('UF2 metadata mismatch')
              seen.append(no); min_addr=min(min_addr,addr); max_end=max(max_end,addr+size)
              if addr>=0x26000: image += b[32:32+size]
          if seen != list(range(total)): raise SystemExit('nonsequential UF2')
          if max_end > 0xEB000: raise SystemExit(f'UF2 reaches raw trace page: {max_end:#x}')
          short=os.environ['GITHUB_SHA'][:8].encode()
          for needle,label in [
              (b'F27-R380-JCR-RAW-'+short,'build marker'),
              (b'Joy-Con 2 (R)','JCR identity'),
              (b'JCR-direct-r380-raw','trace source'),
              (b'# JT begin','trace dump'),
          ]:
              if needle not in image: raise SystemExit('missing '+label)
          for bad,label in [(b'/jc2trace','trace filesystem path'),(b'/jc2mode','mode filesystem tag')]:
              if bad in image: raise SystemExit('forbidden '+label)
          print('sha256',hashlib.sha256(data).hexdigest())
          print('blocks',total,'family',hex(fam),'bytes',len(data),'range',hex(min_addr)+'..'+hex(max_end))
          PY

      - name: Record manifest
        run: |
          cat > build/mdk/F27-R380-DirectJCR-RawTrace.manifest.txt <<EOF
          source_commit=${{ github.sha }}
          upstream_base=29f4d1e8b85c0a7c19e0c8b977a1a56a2c42ea6d
          makerdiary_build_authority=96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          protocol_runtime=exact r379/r374 physical JCR runtime; r375 S/R/C/B/G/O observers only
          experimental_persistence=raw page 0xEB000 only; no trace-side filesystem files/tags
          raw_magic=0x3038544A distinct from M27 raw trace
          persistence_gate=>=10s capture age and >=5s trace silence
          startup=RAM-only direct JCR while no valid raw snapshot; valid snapshot permits saved-mode reboot for CDC JT retrieval
          bond_baseline=clean-board current-main control and r379 both preserve bond across reflashing
          required_test=confirm bond; flash r380; verify RF; test Switch >=20s; use WebUSB to select Steam; enable debug CDC; run JT; then reflash control and verify bond still exists
          do_not=do not use WebUSB staged firmware update during trace test; do not run JC before JT
          EOF
          sha256sum build/mdk/OpenPuck-F27-R380-DirectJCR-RawTrace-MDK.uf2 >> build/mdk/F27-R380-DirectJCR-RawTrace.manifest.txt

      - name: Upload r380 direct JCR raw trace
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-F27-R380-DirectJCR-RawTrace
          retention-days: 30
          if-no-files-found: error
          path: |
            build/mdk/OpenPuck-F27-R380-DirectJCR-RawTrace-MDK.uf2
            build/mdk/F27-R380-DirectJCR-RawTrace.manifest.txt
