name: R397 Switch2Pro FourSelect under HORI 0F0D:0202 JT comparator

on:
  push:
    branches: [diag-switch2pro-fourselect-hori0202-r397-rawtrace]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact r355 Test B authority and narrow branch scope
        run: |
          set -eu
          BASE=f59a0fb02ce866a6cd0416d6aadd92878e0107ee
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE"..HEAD | sort > /tmp/r397-branch-files
          cat /tmp/r397-branch-files
          test "$(wc -l < /tmp/r397-branch-files)" -eq 1
          grep -qx '.github/workflows/diag-switch2pro-fourselect-hori0202-r397-rawtrace.yml' /tmp/r397-branch-files
          test "$(git rev-parse "$BASE:tools/diag_switch2pro_fourselect_noaudio.py")" = bafad4a69ec789f30faf8109c0edcb98a165ad00
          test "$(git rev-parse "$BASE:tools/diag_switch2pro_fourselect_hori0202.py")" = 55169e4c3081554860bd38b6e15428b51e0ffb4c
          TRACE=e2bcb1cf5c011581d10bc0b4e6c167157679a635
          test "$(git rev-parse "$TRACE:tools/diag_switch2pro_fourselect_r394_trace.py")" = 68d5af3f6d534adcc333dd505d4739987c996086

      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: pip install adafruit-nrfutil intelhex

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Apply exact historical r355 Makerdiary support
        run: |
          set -eu
          MDK=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          git fetch origin "$MDK"
          git cherry-pick --no-commit "$MDK"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

      - name: Reconstruct exact accepted Switch2Pro FourSelect no-audio topology
        run: |
          set -eu
          python3 tools/diag_switch2pro_fourselect_noaudio.py
          git diff --check
          grep -q 'sizeof SWITCH2_PRO_CFG_BODY == 191' OpenPuck/mode_switch2_pro.cpp
          grep -q 'vendorOut != 0x05 || vendorIn != 0x85' OpenPuck/mode_switch2_pro.cpp
          grep -q 'itf->bInterfaceNumber < 4' OpenPuck/mode_switch2_pro.cpp
          grep -q 'tud_hid_n_report(hid, rid' OpenPuck/mode_switch2_pro.cpp
          grep -q 'TB_L4, TB_R4, TB_L5, TB_R5' OpenPuck/mode_switch2_pro.cpp
          ! grep -q 'TUSB_CLASS_AUDIO' OpenPuck/mode_switch2_pro.cpp
          cp OpenPuck/mode_switch2_pro.cpp /tmp/r397-pre-id.cpp

      - name: Reproduce exact r355 Test B VID/PID-only transform
        run: |
          set -eu
          python3 tools/diag_switch2pro_fourselect_hori0202.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/r397-pre-id.cpp').read_text()
          after=Path('OpenPuck/mode_switch2_pro.cpp').read_text()
          old='\tUSBDevice.setID(0x057e, 0x2069);\n'
          new='\tUSBDevice.setID(0x0f0d, 0x0202);\n'
          if before.count(old) != 1:
              raise SystemExit('unexpected pre-identity source')
          if after != before.replace(old, new, 1):
              raise SystemExit('r355 Test B identity transform changed more than VID/PID')
          for x in ('USBDevice.setManufacturerDescriptor("Nintendo")',
                    'USBDevice.setProductDescriptor("Switch 2 Pro Controller")',
                    'USBDevice.setSerialDescriptor("00")'):
              if x not in after:
                  raise SystemExit('lost preserved identity field: '+x)
          print('PASS: exact r355 Test B pre-trace source reconstructed')
          PY
          cp OpenPuck/mode_switch2_pro.cpp /tmp/r397-testb-before-trace.cpp

      - name: Apply frozen r394 JT observer with r397 provenance only
        run: |
          set -eu
          TRACE=e2bcb1cf5c011581d10bc0b4e6c167157679a635
          git show "$TRACE:tools/diag_switch2pro_fourselect_r394_trace.py" > /tmp/r394-trace.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/r394-trace.py').read_text()
          if src.count('0x34505453UL') != 1:
              raise SystemExit('unexpected r394 trace magic count')
          if src.count('source=Switch2Pro-FourSelect-r394-raw') != 1:
              raise SystemExit('unexpected r394 trace source count')
          out=src.replace('r394', 'r397')
          out=out.replace('0x34505453UL', '0x37505453UL')
          out=out.replace('source=Switch2Pro-FourSelect-r397-raw',
                          'source=Switch2Pro-FourSelect-HORI0202-r397-raw')
          if 'r394' in out or '0x34505453UL' in out:
              raise SystemExit('stale r394 provenance in adapted observer')
          Path('/tmp/r397-trace.py').write_text(out)
          PY
          python3 /tmp/r397-trace.py
          /usr/bin/clang-format-18 -i OpenPuck/mode_switch2_pro.cpp OpenPuck/mode_switch2_pro.h OpenPuck/serial_console.cpp
          /usr/bin/clang-format-18 --dry-run --Werror OpenPuck/mode_switch2_pro.cpp OpenPuck/mode_switch2_pro.h OpenPuck/serial_console.cpp
          git diff --check

      - name: Prove r355 Test B behavior survived the trace layer
        run: |
          set -eu
          grep -q 'USBDevice.setID(0x0f0d, 0x0202)' OpenPuck/mode_switch2_pro.cpp
          grep -q 'USBDevice.setManufacturerDescriptor("Nintendo")' OpenPuck/mode_switch2_pro.cpp
          grep -q 'USBDevice.setProductDescriptor("Switch 2 Pro Controller")' OpenPuck/mode_switch2_pro.cpp
          grep -q 'USBDevice.setSerialDescriptor("00")' OpenPuck/mode_switch2_pro.cpp
          grep -q 'sizeof SWITCH2_PRO_CFG_BODY == 191' OpenPuck/mode_switch2_pro.cpp
          grep -q 'vendorOut != 0x05 || vendorIn != 0x85' OpenPuck/mode_switch2_pro.cpp
          grep -q 'itf->bInterfaceNumber < 4' OpenPuck/mode_switch2_pro.cpp
          grep -q 'tud_hid_n_report(hid, rid' OpenPuck/mode_switch2_pro.cpp
          grep -q 'TB_L4, TB_R4, TB_L5, TB_R5' OpenPuck/mode_switch2_pro.cpp
          ! grep -q 'TUSB_CLASS_AUDIO' OpenPuck/mode_switch2_pro.cpp
          grep -q 'SW2P4_TRACE_PAGE = 0x000EB000UL' OpenPuck/mode_switch2_pro.cpp
          grep -q 'SW2P4_TRACE_MAGIC = 0x37505453UL' OpenPuck/mode_switch2_pro.cpp
          grep -q 'source=Switch2Pro-FourSelect-HORI0202-r397-raw' OpenPuck/mode_switch2_pro.cpp
          grep -q 'switch2ProFourSelectTraceDump' OpenPuck/serial_console.cpp
          grep -q 'switch2ProFourSelectTraceClear' OpenPuck/serial_console.cpp
          ! grep -q 'InternalFS' OpenPuck/mode_switch2_pro.cpp
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/r397-testb-before-trace.cpp').read_text()
          a=Path('OpenPuck/mode_switch2_pro.cpp').read_text()
          anchors=[
              'USBDevice.setID(0x0f0d, 0x0202);',
              'USBDevice.setManufacturerDescriptor("Nintendo")',
              'USBDevice.setProductDescriptor("Switch 2 Pro Controller")',
              'static_assert(sizeof SWITCH2_PRO_CFG_BODY == 191',
              'vendorOut != 0x05 || vendorIn != 0x85',
              'static const uint32_t selector[4] = { TB_L4, TB_R4, TB_L5, TB_R5 };',
              'if (g_usbMode == MODE_SW2_PRO && itf < 4)',
              'if (itf->bInterfaceNumber < 4 &&',
          ]
          for x in anchors:
              if x not in b or x not in a:
                  raise SystemExit('r355 Test B anchor changed/missing: '+x)
          print('PASS: r397 observer leaves defining Test B topology/identity anchors intact')
          PY

      - name: Generate r397 build provenance
        run: |
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="SW2P4-H0202-R397-${short}" ./gen_version.sh

      - name: Build standard target
        run: |
          mkdir -p build/std build/cache/std
          make build BUILD_PATH=build/cache/std OUTPUT_DIR=build/std

      - name: Build Makerdiary MDK target
        run: make build-mdk

      - name: Generate r397 MDK UF2
        run: ./gen_uf2.sh build/mdk/OpenPuck.ino.hex build/mdk/OpenPuck-Switch2Pro-FourSelect-HORI0202-R397-RawTrace-MDK.uf2

      - name: Validate r397 UF2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          p=Path('build/mdk/OpenPuck-Switch2Pro-FourSelect-HORI0202-R397-RawTrace-MDK.uf2')
          d=p.read_bytes()
          if len(d)%512:
              raise SystemExit('bad UF2 length')
          family=total=None; seen=[]; lo=0xffffffff; hi=0; image=bytearray()
          for off in range(0,len(d),512):
              b=d[off:off+512]
              m0,m1,flags,addr,size,no,nblocks,fam=struct.unpack_from('<IIIIIIII',b,0)
              if (m0,m1)!=(0x0A324655,0x9E5D5157):
                  raise SystemExit('bad UF2 magic')
              family=fam if family is None else family
              total=nblocks if total is None else total
              if fam!=family or nblocks!=total:
                  raise SystemExit('inconsistent UF2 metadata')
              seen.append(no); lo=min(lo,addr); hi=max(hi,addr+size)
              if addr>=0x26000:
                  image += b[32:32+size]
          if family!=0xADA52840:
              raise SystemExit('wrong family')
          if seen!=list(range(total)):
              raise SystemExit('nonsequential blocks')
          if hi>0xEB000:
              raise SystemExit(f'image reaches raw trace page: {hi:#x}')
          for needle,label in [
              (b'SW2P4-H0202-R397-', 'build marker'),
              (b'Switch 2 Pro Controller', 'preserved product'),
              (b'Switch2Pro-FourSelect-HORI0202-r397-raw', 'trace source'),
              (b'# JT begin', 'JT dump')]:
              if needle not in image:
                  raise SystemExit('missing '+label)
          print('PASS',len(d),total,hex(lo),hex(hi),hashlib.sha256(d).hexdigest())
          PY

      - name: Record r397 manifest
        run: |
          cat > build/mdk/Switch2Pro-FourSelect-HORI0202-R397-RawTrace.manifest.txt <<EOF
          purpose=exact r355 Test B replay with r394-equivalent JT observer
          r355_testB_authority=f59a0fb02ce866a6cd0416d6aadd92878e0107ee
          accepted_fourselect_authority=704492ae94f3b7245e206d99cdb5551db5fb8549
          pr269_runtime_base=cafaba6eae52b997c685eecbaea97eb7dadfb050
          r394_observer_authority=e2bcb1cf5c011581d10bc0b4e6c167157679a635
          r394_observer_blob=68d5af3f6d534adcc333dd505d4739987c996086
          source_commit=${GITHUB_SHA}
          historical_mdk_patch=0d1b378e9e75c52b6ea119e685257f4c3c1ac17e
          usb_vid_pid=0F0D:0202
          manufacturer=Nintendo
          product=Switch 2 Pro Controller
          serial=00
          hid_report_contract=Switch2Pro 97-byte descriptor and 0x05/0x09 mapping preserved
          vendor_pairing_contract=preserved
          audio=OMITTED exactly as r355 Test B
          hid_paths=4 full Pro2 HID IN/OUT
          vendor_sessions=1 shared Nintendo vendor IN/OUT
          selectors=L4->HID0,R4->HID1,L5->HID2,R5->HID3
          trace=raw page 0xEB000 magic 0x37505453 phases 1-notready 2-ready 3-queued
          trace_commands=JT dump; JC clear
          filesystem_trace_writes=none
          hardware_status=PENDING
          EOF
          sha256sum build/mdk/OpenPuck-Switch2Pro-FourSelect-HORI0202-R397-RawTrace-MDK.uf2 >> build/mdk/Switch2Pro-FourSelect-HORI0202-R397-RawTrace.manifest.txt

      - uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-Switch2Pro-FourSelect-HORI0202-R397-RawTrace
          retention-days: 30
          if-no-files-found: error
          path: |
            build/mdk/OpenPuck-Switch2Pro-FourSelect-HORI0202-R397-RawTrace-MDK.uf2
            build/mdk/Switch2Pro-FourSelect-HORI0202-R397-RawTrace.manifest.txt
