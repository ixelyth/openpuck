name: F27 JC2 A-B clean vs non-clean

on:
  push:
    branches:
      - f27-jc2-ab-clean-vs-nonclean-oobfix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install build Python packages
        run: pip install adafruit-nrfutil intelhex
      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Compose A clean JCR
        run: |
          set -eu
          git fetch origin 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          git cherry-pick --no-commit 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 tools/f27_g5_integrate.py
          python3 tools/f27_g5_re_refresh.py
          python3 tools/f27_jc2_ab_common_fix.py
          make format
          make check
          git diff --check
          git diff > /tmp/jc2-ab-A-source.diff
      - name: Verify A clean contract
        run: |
          set -eu
          grep -q '#define MODE_JOYCON2 13' OpenPuck/config.h
          grep -q 'JOYCON2(jcr/jcl)' OpenPuck/OpenPuck.ino
          grep -q 'OPK_JC2_START_ONCE' OpenPuck/OpenPuck.ino
          grep -q 'OPK_JC2_START_VARIANT' OpenPuck/OpenPuck.ino
          ! grep -q 'OPK_G5_FORCE_JOYCON2' OpenPuck/OpenPuck.ino
          grep -q 'joyCon2Clean = g_usbMode == MODE_JOYCON2' OpenPuck/OpenPuck.ino
          grep -q '!psClean && !joyCon2Clean' OpenPuck/OpenPuck.ino
          grep -q -- '--wrap=tud_descriptor_configuration_cb' Makefile
          grep -q '__wrap_tud_descriptor_configuration_cb' OpenPuck/mode_joycon2.cpp
          grep -q 'static uint8_t cfg\[80\]' OpenPuck/mode_joycon2.cpp
          grep -q 'cfg\[4\] = 0x02' OpenPuck/mode_joycon2.cpp
          grep -q 'static_assert(sizeof JOYCON2_HID_DESC == 100' OpenPuck/mode_joycon2.cpp
          grep -q 'static_assert(sizeof JOYCON2_CFG_BODY == 71' OpenPuck/mode_joycon2.cpp
          grep -q 'case 0x08:' OpenPuck/mode_joycon2.cpp
          grep -q 'ackHeader(reply, 0x08, cmd\[2\], sub)' OpenPuck/mode_joycon2.cpp
          grep -q '0x01, 0x00, 0x0e, JC2_CONTROLLER_TYPE' OpenPuck/mode_joycon2.cpp
          ! grep -q 'JOYCON2_VENDOR_PROTOCOL' OpenPuck/mode_joycon2.cpp
          ! grep -q 'PAIR_PUBLIC' OpenPuck/mode_joycon2.cpp
          ! grep -q 'primaryCal' OpenPuck/mode_joycon2.cpp
          ! grep -q 'Switch 2 Pro Controller' OpenPuck/mode_joycon2.cpp
          echo 'A clean contract PASS'
      - name: Build A clean Makerdiary JCR
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-JC2-AB-${short}" ./gen_version.sh
          make build-mdk EXTRA_FLAGS="-DOPK_JC2_START_ONCE=1 -DOPK_JC2_START_VARIANT=1 -DOPK_G5_JOYCON_SIDE=2"
          ./gen_uf2.sh build/mdk/OpenPuck.ino.hex build/mdk/OpenPuck-F27-JC2-AB-A-Clean-JCR-MDK.uf2
          cp build/mdk/OpenPuck-F27-JC2-AB-A-Clean-JCR-MDK.uf2 /tmp/
          cp build/mdk/OpenPuck.ino.hex /tmp/OpenPuck-F27-JC2-AB-A-Clean-JCR-MDK.hex

      - name: Recompose B non-clean JCR from identical source authority
        run: |
          set -eu
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git fetch origin 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          git cherry-pick --no-commit 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 tools/f27_g5_integrate.py
          python3 tools/f27_g5_re_refresh.py
          python3 tools/f27_jc2_ab_common_fix.py
          python3 tools/f27_jc2_ab_make_nonclean.py
          make format
          make check
          git diff --check
          git diff > /tmp/jc2-ab-B-source.diff
      - name: Verify B non-clean contract
        run: |
          set -eu
          grep -q '#define MODE_JOYCON2 13' OpenPuck/config.h
          grep -q 'JOYCON2(jcr/jcl)' OpenPuck/OpenPuck.ino
          grep -q 'OPK_JC2_START_ONCE' OpenPuck/OpenPuck.ino
          grep -q 'OPK_JC2_START_VARIANT' OpenPuck/OpenPuck.ino
          ! grep -q 'OPK_G5_FORCE_JOYCON2' OpenPuck/OpenPuck.ino
          ! grep -q 'joyCon2Clean' OpenPuck/OpenPuck.ino
          grep -q 'if (!puckMode && !keepCdc && !psClean)' OpenPuck/OpenPuck.ino
          grep -q 'if (!puckMode && !psClean)' OpenPuck/OpenPuck.ino
          ! grep -q -- '--wrap=tud_descriptor_configuration_cb' Makefile
          ! grep -q '__wrap_tud_descriptor_configuration_cb' OpenPuck/mode_joycon2.cpp
          grep -q -- '--wrap=tud_descriptor_device_cb' Makefile
          grep -q -- '--wrap=tud_hid_descriptor_report_cb' Makefile
          grep -q 'static_assert(sizeof JOYCON2_HID_DESC == 100' OpenPuck/mode_joycon2.cpp
          grep -q 'static_assert(sizeof JOYCON2_CFG_BODY == 71' OpenPuck/mode_joycon2.cpp
          grep -q 'case 0x08:' OpenPuck/mode_joycon2.cpp
          grep -q 'ackHeader(reply, 0x08, cmd\[2\], sub)' OpenPuck/mode_joycon2.cpp
          grep -q '0x01, 0x00, 0x0e, JC2_CONTROLLER_TYPE' OpenPuck/mode_joycon2.cpp
          ! grep -q 'JOYCON2_VENDOR_PROTOCOL' OpenPuck/mode_joycon2.cpp
          ! grep -q 'PAIR_PUBLIC' OpenPuck/mode_joycon2.cpp
          ! grep -q 'primaryCal' OpenPuck/mode_joycon2.cpp
          ! grep -q 'Switch 2 Pro Controller' OpenPuck/mode_joycon2.cpp
          echo 'B non-clean contract PASS'
      - name: Build B non-clean Makerdiary JCR
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-JC2-AB-${short}" ./gen_version.sh
          make build-mdk EXTRA_FLAGS="-DOPK_JC2_START_ONCE=1 -DOPK_JC2_START_VARIANT=2 -DOPK_G5_JOYCON_SIDE=2"
          ./gen_uf2.sh build/mdk/OpenPuck.ino.hex build/mdk/OpenPuck-F27-JC2-AB-B-NonClean-JCR-MDK.uf2
          cp /tmp/OpenPuck-F27-JC2-AB-A-Clean-JCR-MDK.uf2 build/mdk/
          cp /tmp/OpenPuck-F27-JC2-AB-A-Clean-JCR-MDK.hex build/mdk/

      - name: Validate A-B UF2 pair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, os
          sha=os.environ['GITHUB_SHA'][:8]
          files=[
              Path('build/mdk/OpenPuck-F27-JC2-AB-A-Clean-JCR-MDK.uf2'),
              Path('build/mdk/OpenPuck-F27-JC2-AB-B-NonClean-JCR-MDK.uf2'),
          ]
          images=[]
          for p in files:
              data=p.read_bytes(); image=bytearray(); seen=[]; total=None; fam=None; addrs=[]
              if len(data)%512: raise SystemExit(str(p)+': bad UF2 length')
              for off in range(0,len(data),512):
                  b=data[off:off+512]
                  m0,m1,flags,addr,size,no,nblocks,family=struct.unpack_from('<IIIIIIII',b,0)
                  if (m0,m1)!=(0x0A324655,0x9E5D5157): raise SystemExit(str(p)+': bad magic')
                  total=nblocks if total is None else total
                  fam=family if fam is None else fam
                  if nblocks!=total or family!=fam: raise SystemExit(str(p)+': metadata mismatch')
                  seen.append(no); addrs.append(addr)
                  if addr>=0x26000: image += b[32:32+size]
              if seen != list(range(total)): raise SystemExit(str(p)+': nonsequential UF2')
              for needle,label in [
                  (b'F27-G5-CLEAN-JCR-GRIP08','shared JCR protocol marker'),
                  (b'Joy-Con 2 (R)','JCR product'),
                  (('F27-JC2-AB-'+sha).encode(),'shared build marker'),
                  (b'JOYCON2(jcr/jcl)','mode-table fix'),
                  (b'HDL50003485519','Charging Grip serial'),
              ]:
                  if needle not in image: raise SystemExit(str(p)+': missing '+label)
              if b'Switch 2 Pro Controller' in image: raise SystemExit(str(p)+': Pro2 contamination')
              images.append(bytes(image))
              print(p.name,'sha256',hashlib.sha256(data).hexdigest(),'blocks',total,'family',hex(fam),'bytes',len(data),'app_range',hex(min(addrs))+'..'+hex(max(addrs)+256))
          if images[0] == images[1]: raise SystemExit('A and B application images unexpectedly identical')
          print('A/B application images differ as expected')
          PY
      - name: Record A-B manifest
        run: |
          cat > build/mdk/F27-JC2-AB-Clean-vs-NonClean.manifest.txt <<EOF
          source_commit=${{ github.sha }}
          upstream_base=29f4d1e8b85c0a7c19e0c8b977a1a56a2c42ea6d
          endpoint_authority=c711b8c6ce099965995ea6e42e93e2cdce47cb26 plus f27_g5_re_refresh.py
          common_fix=MODE_NAME index 13 added; confirmed S1/S1P out-of-bounds bug removed
          common_boot_policy=each A/B variant enters Joy-Con once for its own variant tag; subsequent mode changes and persistence honored
          side=JCR 057E:2066 native report 0x08
          common_hid=captured 100-byte Joy-Con descriptor
          common_vendor=latest G5 Nintendo bulk + Charging Grip 0x08 implementation
          common_switch2pro_dependency=NONE
          A=clean exact Joy-Con configuration: 2 interfaces, 80-byte config, no wake HID, no WebUSB
          B=non-clean composite: same Joy-Con HID/vendor pair first, normal OpenPuck wake HID + WebUSB appended; 80-byte config wrapper removed
          interpretation=A stable/B stable => extra interfaces tolerated; A stable/B fail => Joy-Con identity requires clean shell; A fail/B stable => exact-clean shell itself is problematic; both fail => remaining full-endpoint issue is independent of clean/composite policy
          EOF
          sha256sum build/mdk/OpenPuck-F27-JC2-AB-A-Clean-JCR-MDK.uf2 >> build/mdk/F27-JC2-AB-Clean-vs-NonClean.manifest.txt
          sha256sum build/mdk/OpenPuck-F27-JC2-AB-B-NonClean-JCR-MDK.uf2 >> build/mdk/F27-JC2-AB-Clean-vs-NonClean.manifest.txt
          cp /tmp/jc2-ab-A-source.diff build/mdk/F27-JC2-AB-A-source.diff
          cp /tmp/jc2-ab-B-source.diff build/mdk/F27-JC2-AB-B-source.diff
      - name: Upload A-B pair
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-F27-JC2-AB-Clean-vs-NonClean
          retention-days: 30
          if-no-files-found: error
          path: |
            build/mdk/OpenPuck-F27-JC2-AB-A-Clean-JCR-MDK.uf2
            build/mdk/OpenPuck-F27-JC2-AB-B-NonClean-JCR-MDK.uf2
            build/mdk/F27-JC2-AB-Clean-vs-NonClean.manifest.txt
            build/mdk/F27-JC2-AB-A-source.diff
            build/mdk/F27-JC2-AB-B-source.diff
