name: F27-M24 dual Joy-Con 2 R role-swap probe

on:
  push:
    branches:
      - f27-switch2pro-m24-role-swap-jcr
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out F27-M24
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Recover pinned topology and Joy-Con helpers
        run: |
          set -eu
          git fetch origin \
            b6bce4d387433372f480593bd28de506ff0b5368 \
            1fecb47401ed9fb7bdb22b8c6fe4707575411250 \
            2f990e0f3e9401a734427e23e8223f2b9f1be799 \
            5bf3b6f7f57f1ba5c131ca7e1c393a7aa85bb0d8
          mkdir -p tools/f27_m15_parts
          git show b6bce4d387433372f480593bd28de506ff0b5368:tools/f27_switch2pro_m15.py > tools/f27_switch2pro_m15.py
          for n in 00 01 02 03 04 05 06 07; do
            git show b6bce4d387433372f480593bd28de506ff0b5368:tools/f27_m15_parts/part${n}.pyfrag > tools/f27_m15_parts/part${n}.pyfrag
          done
          git show 1fecb47401ed9fb7bdb22b8c6fe4707575411250:OpenPuck/f27_joycon2.cpp > OpenPuck/f27_joycon2.cpp
          git show 1fecb47401ed9fb7bdb22b8c6fe4707575411250:OpenPuck/f27_joycon2.h > OpenPuck/f27_joycon2.h
          git show 2f990e0f3e9401a734427e23e8223f2b9f1be799:tools/f27_switch2pro_m21.py > tools/f27_switch2pro_m21.py
          git show 5bf3b6f7f57f1ba5c131ca7e1c393a7aa85bb0d8:tools/f27_switch2pro_m22.py > tools/f27_switch2pro_m22.py

      - name: Apply M21 M22 and M24 composition
        run: |
          python3 tools/f27_switch2pro_m15.py
          python3 tools/f27_switch2pro_m21.py
          python3 tools/f27_switch2pro_m22.py
          python3 tools/f27_switch2pro_m24.py

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Format and verify M24 source
        run: |
          make format
          make check
          git add -N OpenPuck/f27_joycon2.cpp OpenPuck/f27_joycon2.h
          git diff --check
          test ! -e OpenPuck/git_version.h
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' OpenPuck/OpenPuck.ino OpenPuck/f27_joycon2.cpp OpenPuck/f27_joycon2.h OpenPuck/mode_switch2_pro.cpp | sort)"
          grep -q 'F27-M24-ROLE-SWAP-JCR' OpenPuck/mode_switch2_pro.cpp
          ! grep -q 'F27-M23-JCR-JCL-LEFT-MOUSE' OpenPuck/mode_switch2_pro.cpp
          grep -q 'M24 first function is the companion' OpenPuck/mode_switch2_pro.cpp
          grep -q 'M24 second function carries the original/live common report' OpenPuck/mode_switch2_pro.cpp
          grep -q 's != M15_SW2_JOYCON_R' OpenPuck/mode_switch2_pro.cpp
          grep -q 'TB_LPADT' OpenPuck/mode_switch2_pro.cpp
          grep -q 'bool requestedMouse = true' OpenPuck/f27_joycon2.cpp
          grep -q 'if (surface)' OpenPuck/f27_joycon2.cpp
          python3 - <<'PY'
          from pathlib import Path
          s=Path('OpenPuck/mode_switch2_pro.cpp').read_text()
          addr="if (g_sw2SessionCtx == M15_SW2_PRO)\n\t\tout[5] ^= 0x01u;"
          serial="if (g_sw2SessionCtx == M15_SW2_PRO) {\n\t\tconst uint32_t serialTail"
          if addr not in s: raise SystemExit('M24 companion address is not on session0')
          if serial not in s: raise SystemExit('M24 companion serial is not on session0')
          if 'if (s == M15_SW2_PRO) {' not in s: raise SystemExit('M24 first-session payload role missing')
          if 'else if (itf == M15_SW2_PRO) {' not in s: raise SystemExit('M24 first-session GET_REPORT role missing')
          PY

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build Python packages
        run: pip install adafruit-nrfutil intelhex

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Build standard F27-M24 target
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-M24-ROLESWAP-${short}" ./gen_version.sh
          mkdir -p build/f27-standard build/cache/f27-standard
          make build \
            BUILD_PATH=build/cache/f27-standard \
            OUTPUT_DIR=build/f27-standard \
            EXTRA_FLAGS="-DOPK_F27_JOYCON_TARGET=2"
          ./gen_uf2.sh build/f27-standard/OpenPuck.ino.hex \
            build/f27-standard/OpenPuck-F27-M24-RoleSwap-JoyConR-standard.uf2
          cp build/f27-standard/OpenPuck-F27-M24-RoleSwap-JoyConR-standard.uf2 /tmp/
          cp build/f27-standard/OpenPuck.ino.hex /tmp/OpenPuck-F27-M24-standard.hex

      - name: Compose current-main Makerdiary support
        run: |
          set -eu
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git fetch origin 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          git cherry-pick --no-commit 96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Recompose M24 over Makerdiary build
        run: |
          set -eu
          git fetch origin \
            b6bce4d387433372f480593bd28de506ff0b5368 \
            1fecb47401ed9fb7bdb22b8c6fe4707575411250 \
            2f990e0f3e9401a734427e23e8223f2b9f1be799 \
            5bf3b6f7f57f1ba5c131ca7e1c393a7aa85bb0d8
          mkdir -p tools/f27_m15_parts
          git show b6bce4d387433372f480593bd28de506ff0b5368:tools/f27_switch2pro_m15.py > tools/f27_switch2pro_m15.py
          for n in 00 01 02 03 04 05 06 07; do
            git show b6bce4d387433372f480593bd28de506ff0b5368:tools/f27_m15_parts/part${n}.pyfrag > tools/f27_m15_parts/part${n}.pyfrag
          done
          git show 1fecb47401ed9fb7bdb22b8c6fe4707575411250:OpenPuck/f27_joycon2.cpp > OpenPuck/f27_joycon2.cpp
          git show 1fecb47401ed9fb7bdb22b8c6fe4707575411250:OpenPuck/f27_joycon2.h > OpenPuck/f27_joycon2.h
          git show 2f990e0f3e9401a734427e23e8223f2b9f1be799:tools/f27_switch2pro_m21.py > tools/f27_switch2pro_m21.py
          git show 5bf3b6f7f57f1ba5c131ca7e1c393a7aa85bb0d8:tools/f27_switch2pro_m22.py > tools/f27_switch2pro_m22.py
          python3 tools/f27_switch2pro_m15.py
          python3 tools/f27_switch2pro_m21.py
          python3 tools/f27_switch2pro_m22.py
          python3 tools/f27_switch2pro_m24.py
          make format
          make check
          git add -N OpenPuck/f27_joycon2.cpp OpenPuck/f27_joycon2.h
          git diff --check
          test ! -e OpenPuck/git_version.h
          grep -q 'OPK_BOARD_MDK_USB_DONGLE' Makefile
          grep -q 'F27-M24-ROLE-SWAP-JCR' OpenPuck/mode_switch2_pro.cpp

      - name: Build Makerdiary MDK F27-M24 target
        run: |
          set -eu
          short="${GITHUB_SHA::8}"
          OPK_BUILD_VERSION="F27-M24-ROLESWAP-${short}" ./gen_version.sh
          make build-mdk EXTRA_FLAGS="-DOPK_F27_JOYCON_TARGET=2"
          ./gen_uf2.sh build/mdk/OpenPuck.ino.hex \
            build/mdk/OpenPuck-F27-M24-RoleSwap-JoyConR-MDK.uf2
          mkdir -p build/f27-standard
          cp /tmp/OpenPuck-F27-M24-RoleSwap-JoyConR-standard.uf2 build/f27-standard/
          cp /tmp/OpenPuck-F27-M24-standard.hex build/f27-standard/OpenPuck.ino.hex

      - name: Validate M24 artifact identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, os
          build=("F27-M24-ROLESWAP-"+os.environ['GITHUB_SHA'][:8]).encode()
          marker=b'F27-M24-ROLE-SWAP-JCR'
          for path in [
              'build/f27-standard/OpenPuck-F27-M24-RoleSwap-JoyConR-standard.uf2',
              'build/mdk/OpenPuck-F27-M24-RoleSwap-JoyConR-MDK.uf2',
          ]:
              data=Path(path).read_bytes()
              if len(data)%512: raise SystemExit(f'non-UF2 length: {path}')
              image=bytearray(); seen=[]; total=None; fam=None; addrs=[]
              for off in range(0,len(data),512):
                  b=data[off:off+512]
                  m0,m1,flags,addr,size,no,nblocks,family=struct.unpack_from('<IIIIIIII',b,0)
                  if (m0,m1)!=(0x0A324655,0x9E5D5157): raise SystemExit(f'bad magic: {path}')
                  total=nblocks if total is None else total
                  fam=family if fam is None else fam
                  if nblocks!=total or family!=fam: raise SystemExit(f'inconsistent metadata: {path}')
                  seen.append(no)
                  if addr>=0x26000:
                      image += b[32:32+size]; addrs.append(addr)
              if seen != list(range(total)): raise SystemExit(f'non-sequential blocks: {path}')
              if marker not in image: raise SystemExit(f'missing M24 marker: {path}')
              if build not in image: raise SystemExit(f'missing M24 build label: {path}')
              print(path,'PASS','blocks',total,'family',hex(fam),'range',hex(min(addrs)),hex(max(addrs)+256))
          PY

      - name: Record experiment manifest
        run: |
          cat > build/F27-M24-RoleSwap-JoyConR.manifest.txt <<EOF
          source_commit=${{ github.sha }}
          runtime_base=1b4c0fae82489ab6034004c69ed6c8979268eb03
          m20_hardware_positive=6c2e191693fec0baadeeda8938275e6d04a5463b
          m21_dual_topology=2f990e0f3e9401a734427e23e8223f2b9f1be799
          m22_hidden_session_hardware_fail=5bf3b6f7f57f1ba5c131ca7e1c393a7aa85bb0d8
          makerdiary_current_main_composition=96721b9bf50fbb92fc956853b8ef73dcf2ae973c
          target=F27-M24-RoleSwap-JoyConR
          topology=identical dual Joy-Con2-R USB descriptor/function topology as M22
          session0=FIRST USB function; companion/distinct address+serial; forced report08; LEFT trackpad mouse; neutral buttons/stick
          session1=SECOND USB function; original/live address+serial role; forced stream if HID1 ready; normal controller input; RIGHT trackpad M3 mouse path
          purpose=discriminate first-function selection from original-logical-identity selection after M22 showed session1 mouse traffic ignored
          result_if_left_only=Switch consumes first Nintendo USB function and ignores second
          result_if_right_only=Switch follows original/live logical identity even when it is second USB function
          result_if_both=second-function rejection in M22 had another cause
          result_if_neither=role swap disturbs registration and requires narrower control
          EOF
          sha256sum build/f27-standard/OpenPuck-F27-M24-RoleSwap-JoyConR-standard.uf2 >> build/F27-M24-RoleSwap-JoyConR.manifest.txt
          sha256sum build/mdk/OpenPuck-F27-M24-RoleSwap-JoyConR-MDK.uf2 >> build/F27-M24-RoleSwap-JoyConR.manifest.txt

      - name: Upload F27-M24 target
        uses: actions/upload-artifact@v7
        with:
          name: OpenPuck-F27-M24-RoleSwap-JoyConR
          retention-days: 30
          if-no-files-found: error
          path: |
            build/f27-standard/OpenPuck-F27-M24-RoleSwap-JoyConR-standard.uf2
            build/f27-standard/OpenPuck.ino.hex
            build/mdk/OpenPuck-F27-M24-RoleSwap-JoyConR-MDK.uf2
            build/mdk/OpenPuck.ino.hex
            build/F27-M24-RoleSwap-JoyConR.manifest.txt
